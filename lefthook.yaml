pre-commit:
  piped: true
  fail_on_changes: always
  fail_on_changes_diff: true
  jobs:
    - name: install dependencies
      run: pnpm install

    - name: check types
      run: pnpm --recursive exec tsc

    - name: fix formatting
      group:
        parallel: true
        jobs:
          - name: root project
            run: pnpm prettier --write .

          - name: subprojects
            run: pnpm --recursive exec prettier --write .

    - name: fix lint
      run: pnpm --recursive exec eslint --fix
