version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vitest:
        patterns:
          - vitest
          - "@vitest/coverage-v8"
          - "@vitest/browser-playwright"

  - package-ecosystem: rust-toolchain
    directory: /server
    schedule:
      interval: daily
