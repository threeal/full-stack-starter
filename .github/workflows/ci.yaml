name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0
        with:
          version-file: app/package.json

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin,dprint

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.1.0

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

      - name: Test app
        working-directory: app
        run: pnpm vitest run

      - name: Test server
        working-directory: server
        run: cargo tarpaulin

      - name: Build app
        working-directory: app
        run: pnpm vite build

      - name: Build server
        working-directory: server
        run: cargo build --release
