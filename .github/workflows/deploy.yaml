name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout Project
        uses: actions/checkout@v6.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v1.0.0
        with:
          version: 10.33.4

      - name: Install Dependencies
        run: pnpm install

      - name: Build App
        run: pnpm --filter app build

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: app/dist

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v5.0.0
