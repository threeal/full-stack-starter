name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v6.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.1.0

      - name: Check Pre-commit Hook
        run: lefthook run pre-commit --all-files

      - name: Test Project
        run: pnpm --recursive test

      - name: Build Project
        run: pnpm --recursive build
