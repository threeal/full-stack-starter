[package]
name = "counter"
edition = "2024"
rust-version = "1.100"

[dependencies]
axum = "0.8.9"
include_dir = "0.7.4"
mime_guess = "2.0.5"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints.cargo]
default = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[lints.rust]
warnings = "deny"
missing_docs = "deny"
